{% load admin_urls admin_modify %}

<div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand brand" href="{{ site_url }}">
            {% load static %}
            <img src="{% static 'images/logo-icon.png' %}" width="30" height="30" class="d-inline-block align-top logo" alt="">
            codifyDB
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarToggler">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'index' %}">Tools</a>
            </li>
            {% if request.user.is_authenticated is False %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:login' %}">Login</a>
                </li>
            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:codifyweb_checklist_changelist' %}">Check lists</a>
                </li>

                        aria-expanded="false"
                        aria-haspopup="true"

                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                    >
                    Profile
                    </a>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuLink">
                        <a class="dropdown-item" href="{% url 'admin:password_change' %}">

                        </a>
                        <a class="dropdown-item" href="{% url 'admin:logout' %}">

                    </div>
                </li>

        </ul>
