{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="uft-8">
    <title>{% block title %} DBC Inventory Management Tools {% endblock%} </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Social Tags -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,300,500,700,600" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    {% load static %}
    <link href="{% static 'css/main.css ' %}" rel="stylesheet" type="text/css">
    {% load static %}
    <link rel="icon" href="{% static 'images/favicon.png' %}">
    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    
</head>

<body>

        <a class="navbar-brand brand" href="#">
            {% load static %}
            <img src="{% static 'images/logo-icon.png' %}" width="30" height="30" class="d-inline-block align-top logo" alt="">
        CodifyDB
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="true" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarToggler">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="">Tools</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="">Targets</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="">Checklist</a>
              </li>
            </ul>
          </div>
        </nav>
    {% block content %}
